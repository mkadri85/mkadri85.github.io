<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Mohamed Kadri</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
<style>
  :root{--bg:#0a0e16;--panel:#121a29;--line:#243044;--ink:#eef1f6;--mut:#9aa6b8;--accent:#4f8fc9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;
    font-family:Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
  .card{text-align:center;padding:48px 32px;max-width:520px}
  .code{font-size:64px;font-weight:800;color:var(--accent);letter-spacing:-.03em;margin:0}
  h1{font-size:22px;margin:8px 0 10px}
  p{color:var(--mut);margin:0 0 28px}
  .links a{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:10px 20px;
    margin:0 6px 10px;color:var(--ink);text-decoration:none;font-size:14px;transition:.2s}
  .links a:hover{border-color:var(--accent)}
  .links a.primary{background:var(--accent);border-color:var(--accent);color:#0a0e16;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>That page does not exist</h1>
    <p>It may have moved. Everything worth reading is one click away.</p>
    <div class="links">
      <a class="primary" href="/">Home</a>
      <a href="/#projects">Projects</a>
      <a href="/blog/">Writing</a>
      <a href="/#contact">Contact</a>
    </div>
  </div>
</body>
</html>
